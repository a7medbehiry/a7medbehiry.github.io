فلاتر، واختيارات للمنتج، وسلة، ودفع عند الاستلام، وتتبع الطلب، ومرتجعات، مع سلة للزائر بتندمج أول ما يسجل دخول.","Clean Architecture مع Cubit و go_router، ومغطّى بأكتر من 3,000 اختبار unit و widget و golden.","شات دعم لحظي بالـ WebSockets، وإشعارات، ولينكات للمنتجات بتفتح في التطبيق، مع التعامل مع انقطاع النت.","عناوين من الخريطة بتتربط بمدن الشحن؛ عربي وإنجليزي (RTL/LTR) ووضع فاتح وداكن.","CI/CD بـ GitHub Actions لحد TestFlight، وتحديثات OTA بـ Shorebird."]},stack:["Flutter","Dart","Cubit","Clean Architecture","WebSockets","FCM","Deep Linking","Google Maps","GitHub Actions","Shorebird"],role:{en:"Freelance · sole developer",ar:"فريلانس · المطور الوحيد"},play:"https://play.google.com/store/apps/details?id=com.amb.shopsiia",appStore:"https://apps.apple.com/us/app/shopsiia/id6806533353",demo:"shopsiia",status:"live"},{id:"lets",name:"Let's",icon:Da,kind:{en:"Real-time chat and calls",ar:"شات ومكالمات لحظية"},summary:{en:"A social messaging app with private, group and public chats, voice and video calls, stories and QR-based contact sharing.",ar:"تطبيق رسائل فيه شات خاص وجروبات وغرف عامة، ومكالمات صوت وفيديو، وستوري، ومشاركة جهات اتصال بالـ QR."},points:{en:["Real-time messaging over WebSockets with typing indicators and presence","Voice and video calls with Agora, ringing on the lock screen through CallKit even when the app is closed","QR deep links that open a chat directly, and live location sharing between users"],ar:['رسائل لحظية بالـ WebSockets مع "بيكتب الآن" وحالة الأونلاين',"مكالمات صوت وفيديو بـ Agora، والموبايل بيرن على شاشة القفل بـ CallKit حتى والتطبيق مقفول","لينكات QR بتفتح الشات مباشرة، ومشاركة الموقع المباشر بين المستخدمين"]},stack:["Flutter","Bloc","WebSockets (Pusher)","Agora RTC","CallKit & VoIP push","FCM","Foreground service","Deep links","ML Kit QR","Live location","Stories & camera","Video compression"],role:{en:"Sole developer",ar:"المطور الوحيد"},play:"https://play.google.com/store/apps/details?id=com.tqnia.magchat",appStore:"https://apps.appl
